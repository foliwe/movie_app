services:
  web:
    environment:
      SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Mboko Reels <noreply@mbokoreels.local>}
      APP_URL: ${APP_URL:-http://127.0.0.1:3000}
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
