services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://movieapp:movieapp@postgres:5432/movieapp}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  web:
    ports: !reset []
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://movieapp:movieapp@postgres:5432/movieapp}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  postgres:
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/start.sh:/start.sh:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: ["/bin/sh", "/start.sh"]
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    depends_on:
      nginx:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $$!;
        done
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  certbot-www:
  letsencrypt:
